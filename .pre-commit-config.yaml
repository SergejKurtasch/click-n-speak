# .pre-commit-config.yaml
repos:
  # Repository-owned agent context contract
  - repo: local
    hooks:
      - id: development-environment
        name: check development environment
        entry: venv/bin/python scripts/check_dev_environment.py
        language: system
        pass_filenames: false
        always_run: true
      - id: agent-environment
        name: validate agent environment
        # `language: python` supplies an isolated interpreter for this hook.
        entry: python scripts/validate_agent_environment.py
        language: python
        pass_filenames: false
        always_run: true

  # Ruff — линтинг и форматирование (заменяет flake8 + black + isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Mypy — проверка типов
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --no-strict-optional]

  # Базовые проверки — лишние пробелы, конец файла, большие файлы
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key
      - id: check-merge-conflict
