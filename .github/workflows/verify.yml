name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  swift:
    name: Swift verification
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned whisper.cpp XCFramework
        run: bash scripts/build_whisper_xcframework.sh
      - name: Run Swift verification
        run: bash scripts/swift_verify.sh
