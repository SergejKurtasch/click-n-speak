name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build pinned whisper.cpp XCFramework
        run: bash scripts/build_whisper_xcframework.sh

      - name: Build Application (Swift)
        run: bash scripts/swift_build_app.sh release

      - name: Package into DMG
        run: bash scripts/make_swift_dmg.sh

      - name: Upload Artifact for Workflow
        uses: actions/upload-artifact@v4
        with:
          name: Click-n-speak-macOS
          path: |
            dist/*.dmg
            dist/*.manifest.json
          retention-days: 7

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.manifest.json
